
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Page2LLM banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#0a1411"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#10b981" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>
  <rect width="1200" height="480" fill="url(#dots)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Vazirmatn', sans-serif">
    <text x="80" y="178" font-size="88" font-weight="800" fill="#fafafa" letter-spacing="-2">Page2LLM</text>
    <rect x="84" y="204" width="180" height="7" rx="3.5" fill="url(#acc)"/>
    <text x="80" y="262" font-size="25" fill="#a1a1aa">Clean pages in. Structured Markdown out. LLM-ready.</text>

    <g font-size="15" font-weight="600">
      <rect x="80" y="300" width="140" height="38" rx="19" fill="#131316" stroke="#27272a"/>
      <text x="150" y="324" fill="#10b981" text-anchor="middle">Manifest V3</text>
      <rect x="232" y="300" width="128" height="38" rx="19" fill="#131316" stroke="#27272a"/>
      <text x="296" y="324" fill="#10b981" text-anchor="middle">100% Local</text>
      <rect x="372" y="300" width="122" height="38" rx="19" fill="#131316" stroke="#27272a"/>
      <text x="433" y="324" fill="#10b981" text-anchor="middle">Markdown</text>
      <rect x="506" y="300" width="132" height="38" rx="19" fill="#131316" stroke="#27272a"/>
      <text x="572" y="324" fill="#10b981" text-anchor="middle">Persian RTL</text>
    </g>

    <text x="80" y="406" font-size="23" fill="#d4d4d8">صفحه‌خوان هوش مصنوعی — استخراج متنِ تمیز صفحه و آماده‌سازی آن برای مدل‌های زبانی</text>
    <text x="80" y="440" font-size="16" fill="#52525b">Extract • Convert • Copy — بدون ارسال هیچ داده‌ای به بیرون مرورگر</text>

    <!-- کارت فقط ۵۰ واحد به بالا منتقل شده است -->
    <g filter="url(#sh)" transform="translate(0, -50)">
      <rect x="790" y="88" width="330" height="316" rx="18" fill="#131316" stroke="#27272a" stroke-width="1.5"/>
      <circle cx="820" cy="122" r="13" fill="url(#acc)"/>
      <rect x="844" y="112" width="150" height="9" rx="4.5" fill="#3f3f46"/>
      <rect x="844" y="128" width="92" height="7" rx="3.5" fill="#27272a"/>
      <rect x="806" y="156" width="298" height="26" rx="9" fill="#1c1c1f"/>
      <rect x="812" y="162" width="88" height="14" rx="7" fill="#10b981" opacity="0.9"/>
      <rect x="1012" y="162" width="80" height="14" rx="7" fill="#27272a"/>
      <rect x="806" y="200" width="298" height="8" rx="4" fill="#27272a"/>
      <rect x="806" y="218" width="262" height="8" rx="4" fill="#27272a"/>
      <rect x="806" y="236" width="284" height="8" rx="4" fill="#27272a"/>
      <rect x="806" y="254" width="214" height="8" rx="4" fill="#27272a"/>
      <rect x="806" y="280" width="68" height="30" rx="8" fill="#18181b" stroke="#27272a"/>
      <rect x="882" y="280" width="68" height="30" rx="8" fill="#18181b" stroke="#27272a"/>
      <rect x="958" y="280" width="68" height="30" rx="8" fill="#18181b" stroke="#27272a"/>
      <rect x="1034" y="280" width="68" height="30" rx="8" fill="#18181b" stroke="#27272a"/>
      <rect x="806" y="330" width="298" height="42" rx="11" fill="url(#acc)"/>
      <text x="955" y="357" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Copy for LLM</text>
    </g>
  </g>
</svg>
