      - name: Package extension
        run: |
          mkdir -p page2llm
          cp -r dist/* page2llm/
          zip -r page2llm-v${{ github.ref_name }}-chrome.zip page2llm
          rm -rf page2llm

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: page2llm-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
